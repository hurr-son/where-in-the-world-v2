# Settings for tools/build_grid.py. Paths are relative to the repo root.

[inputs]
population = "data/raw/GHS_POP_E2025_GLOBE_R2023A_4326_30ss/GHS_POP_E2025_GLOBE_R2023A_4326_30ss_V1_0.tif"
countries = "data/raw/ne_10m_admin_0_countries/ne_10m_admin_0_countries.shp"

[grid]
# Output cell size in degrees. Must be a whole multiple of the raster's pixel
# size (30 arc-seconds = 1/120 degree), so 0.05 = 6 x 6 pixels.
cell_size_deg = 0.05

[countries]
# A cell belongs to the country its centre falls in. Populated cells whose
# centre is in no country (mostly coastal cells, plus small islands missing
# from Natural Earth) get the nearest country within max_snap_km, measured in
# metric_crs (Equal Earth), not in degrees.
metric_crs = "EPSG:8857"
max_snap_km = 200

[filters]
# Cells with fewer people than this are dropped. 1000 people in a 0.05 degree
# cell (~20-30 km2) is roughly rural land with villages.
min_cell_pop = 1000
# Countries (Natural Earth admin-0 units, including dependencies) with fewer
# people than this are dropped entirely.
min_country_pop = 100000

[output]
path = "public/data/grid.json"
