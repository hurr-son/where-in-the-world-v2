# Build the site and publish it to GitHub Pages on every push to main.
# Needs: Settings > Pages > Source = "GitHub Actions", and a repository
# secret VITE_MAPBOX_TOKEN (a URL-restricted public Mapbox token).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow running it by hand from the Actions tab

# Only what publishing to Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two deployments run at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly the versions in package-lock.json.
      - run: npm ci
      - run: npm test

      # Vite bakes VITE_* variables into the bundle at build time.
      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
