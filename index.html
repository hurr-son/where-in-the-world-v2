<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where in the World</title>
  </head>
  <body>
    <div id="app">
      <!-- The round: always underneath. The sections below are overlays. -->
      <div id="imagery" class="imagery"></div>
      <div class="hud">
        <span id="hud-round"></span>
        <span id="hud-score"></span>
      </div>
      <div id="guess-panel" class="guess-panel">
        <div class="guess-map-wrap">
          <div id="guess-map" class="guess-map"></div>
          <button id="guess-expand" class="guess-expand" type="button">Tap to guess</button>
          <button id="guess-collapse" class="guess-collapse" type="button">Show image</button>
        </div>
        <button id="guess-button" class="button" type="button" disabled>Guess</button>
      </div>

      <section class="overlay" data-screen="start">
        <h1>Where in the World</h1>
        <p>
          You'll see satellite images of places where people live. Click the map
          where you think each one is: the closer you are, the more points you get.
        </p>
        <button id="start-button" class="button" type="button" disabled>Loading…</button>
      </section>

      <section class="overlay result" data-screen="result" hidden>
        <div id="result-map" class="result-map"></div>
        <div class="result-panel">
          <p id="result-text" class="result-text"></p>
          <button id="next-button" class="button" type="button">Next round</button>
        </div>
      </section>

      <section class="overlay" data-screen="summary" hidden>
        <h1>Your score</h1>
        <p id="summary-total" class="summary-total"></p>
        <table class="summary-table">
          <thead>
            <tr><th>Round</th><th>Country</th><th>Distance</th><th>Points</th></tr>
          </thead>
          <tbody id="summary-rows"></tbody>
        </table>
        <button id="play-again-button" class="button" type="button">Play again</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
